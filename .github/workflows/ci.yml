name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The kit owns the exec boundary it asks the tools to respect: `runner`
      # is the only package here allowed to start a process.
      - name: exec boundary
        run: bash tools/check-exec.sh .

      - name: go test
        run: go test -race ./...

      - name: verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
