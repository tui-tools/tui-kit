name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single place the family's Go version lives, so a
          # bump there moves CI with it.
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The family's lint bar, shared as .golangci.yml. Nothing is excluded
      # wholesale: a deliberate finding carries a //nolint saying why.
      #
      # Built from source rather than downloaded: golangci-lint refuses a
      # module whose language version is newer than the Go it was built with,
      # and no released binary is built with 1.27 yet. goinstall compiles it
      # with the Go set up above, so the lint tracks the toolchain.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: goinstall

      # The kit owns the exec boundary it asks the tools to respect: `runner`
      # is the only package here allowed to start a process.
      - name: exec boundary
        run: bash tools/check-exec.sh .

      - name: go test
        run: go test -race ./...

      # The Python tooling under tools/ is shared by every tool in the family,
      # so a break there breaks all of their screenshots at once.
      - name: tools test
        run: python3 -m unittest discover -s tools/tests -p '*_test.py'

      - name: verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
