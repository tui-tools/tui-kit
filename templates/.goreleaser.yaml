# GoReleaser template for a tui-tools tool.
#
# Copy this to the tool's repository root as `.goreleaser.yaml` and replace
# every __TOOL__ with the tool name (`tui-firewall`) and __TAGLINE__ with the
# manifest's `tagline`, verbatim. One repository, one binary, one tag series:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# CI runs `goreleaser release` on a v* tag and attaches the static
# linux/amd64 and linux/arm64 archives, plus a .deb, an .rpm and a pacman
# package per architecture, to the GitHub release — each archive with its
# SBOM, and checksums.txt with a keyless cosign signature.
#
# GoReleaser cannot read tool.json, so the description below is a copy of the
# manifest's tagline. tui-kit/tools/check-nfpm.py asserts the two are
# identical, and `make manifest` runs it, so the copy cannot drift.
version: 2

project_name: __TOOL__

before:
  hooks:
    - go mod download

builds:
  - id: __TOOL__
    main: ./cmd/__TOOL__
    binary: __TOOL__
    env:
      # Static binaries: no libc dependency, one file to copy anywhere.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: __TOOL__
    ids:
      - __TOOL__
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - examples/config.toml

# The distribution packages. Three formats times two architectures is six
# files per release, and they are what pkgs.tui.tools indexes into the apt,
# dnf and pacman repositories: a tool is then installed and upgraded the way
# everything else on the machine is.
nfpms:
  - id: __TOOL__
    ids:
      - __TOOL__
    package_name: __TOOL__
    formats:
      - deb
      - rpm
      - archlinux
    # Each ecosystem's own naming, so the files look native where they land:
    # __TOOL___0.2.1_amd64.deb, __TOOL__-0.2.1.x86_64.rpm,
    # __TOOL__-0.2.1-1-x86_64.pkg.tar.zst.
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: tui-tools
    homepage: https://tui.tools/tools/__TOOL__/
    maintainer: tui-tools <maintainers@tui.tools>
    # Quoted: a tagline often contains a colon, which unquoted YAML reads as
    # a mapping.
    description: "__TAGLINE__"
    license: MIT
    # The binary belongs in the distribution's own path, not /usr/local: it
    # arrives through the package manager, so the package manager owns it.
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: README.md
        dst: /usr/share/doc/__TOOL__/README.md
      - src: LICENSE
        dst: /usr/share/doc/__TOOL__/LICENSE
      - src: examples/config.toml
        dst: /usr/share/doc/__TOOL__/config.toml
    # The package owns the binary name, so anything else shipping the same
    # command — an AUR -bin build, a hand-installed copy packaged locally —
    # is a conflict rather than a silent overwrite.
    provides:
      - __TOOL__
    conflicts:
      - __TOOL__-bin
    rpm:
      group: Applications/System
    archlinux:
      pkgbase: __TOOL__
      packager: tui-tools <maintainers@tui.tools>

checksum:
  name_template: checksums.txt

# One SBOM per archive, in CycloneDX JSON, generated by syft from the archive
# itself rather than from the source tree, so it describes what was actually
# shipped. The release job installs syft before calling GoReleaser.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"
    cmd: syft
    args:
      - "$artifact"
      - --output
      - cyclonedx-json=$document

# Keyless signing: cosign gets its identity from the workflow's OIDC token,
# so there is no signing key to hold, rotate or leak, and the certificate
# names the workflow and the tag that produced the file.
#
# Only checksums.txt is signed. It already names every archive and every
# package with its digest, so one signature covers the whole release: verify
# the file, then `sha256sum -c` whatever you downloaded against it.
#
# The output is a Sigstore bundle — certificate, signature and transparency
# log entry in one file — which is what `cosign verify-blob --bundle` reads.
signs:
  - id: checksums
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
  # The release notes a person reads first. GoReleaser's own changelog — the
  # commit list — is appended below this block, and a bare commit list is not
  # a description of a release: it says what was touched, not what changed for
  # somebody running the tool.
  #
  # `.TagBody` is the annotated tag's message, so the summary is written once,
  # where the release is actually cut:
  #
  #   git tag -a v0.3.0 -m "<what changed for a user>"
  #
  # A lightweight tag leaves it blank, which is the reminder to write one.
  header: |
    ## __TOOL__ {{ .Tag }}

    {{ .TagBody }}

    Built by this repository's CI on the tag itself. Each archive ships a
    CycloneDX SBOM, `checksums.txt` carries a keyless cosign signature, and
    every file has SLSA build provenance — see the README's "Verify a
    download" for the two commands that check them.

    The commits in this release:
